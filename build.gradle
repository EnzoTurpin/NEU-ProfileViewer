plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"neupv" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven { name = 'nea'; url = 'https://repo.nea.moe/releases' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Lisp interpreter for NEU-REPO constants/hotmlayout.json (HOTM tab), bundled with the Kotlin stdlib it needs
	implementation "moe.nea:nealisp:1.1.0"
	include "moe.nea:nealisp:1.1.0"
	include "org.jetbrains.kotlin:kotlin-stdlib:1.7.20"
	include "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.20"
	include "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.20"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "neupv-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output
	}
}
